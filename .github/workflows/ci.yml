name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  late-edition:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: late-edition
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: late-edition/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: late-edition-playwright-report
          path: |
            late-edition/playwright-report/
            late-edition/test-results/
          retention-days: 7

  keeper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keeper
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: keeper/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keeper-playwright-report
          path: |
            keeper/playwright-report/
            keeper/test-results/
          retention-days: 7

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check launcher links
        run: bash scripts/linkcheck.sh

      - name: Check Late Edition documentation and checker self-tests
        run: |
          bash late-edition/scripts/check-docs.sh
          bash late-edition/scripts/check-docs.test.sh

      - name: Verify games.json and index.html manifest parity
        run: |
          node -e '
            const fs = require("fs");
            const gamesJson = JSON.parse(fs.readFileSync("games.json", "utf8"));
            const html = fs.readFileSync("index.html", "utf8");
            const m = html.match(/<script type="application\/json" id="games-data">\s*([\s\S]*?)\s*<\/script>/);
            if (!m) { console.error("Missing games-data script block in index.html"); process.exit(1); }
            const inlineJson = JSON.parse(m[1]);
            if (JSON.stringify(gamesJson) !== JSON.stringify(inlineJson)) {
              console.error("games.json and index.html #games-data are out of sync");
              process.exit(1);
            }
            for (const g of gamesJson.games) {
              if (g.slug === "cogfall") continue;
              const target = g.href.endsWith("/") ? g.href + "index.html" : g.href;
              if (!fs.existsSync(target)) {
                console.error("Missing target file for", g.slug, target);
                process.exit(1);
              }
            }
            console.log("Verified", gamesJson.games.length, "games in manifest.");
          '

      - name: Syntax-check all JS & ES module scripts across the repo
        run: |
          count=0
          while IFS= read -r -d '' f; do
            node --input-type=module --check < "$f" || { echo "Syntax check failed: $f"; exit 1; }
            count=$((count + 1))
          done < <(find . -name '*.js' -not -path './.git/*' -not -path '*/node_modules/*' -not -path '*/dist/*' -print0)
          echo "Verified syntax of $count JS files across all games."

  # Mutation gate on changed keeper/js files (≥90%). Additive — does not replace keeper/late-edition/validate.
  keeper-mutation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keeper
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: keeper/package-lock.json

      - run: npm ci
      - name: Mutation score on changed keeper/js (≥90%)
        env:
          MUTATION_MIN: "90"
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: npm run test:mutation:changed

