<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Late Edition — 0.4 photog · darkroom · verified</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;0,6..96,900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --ink: #0a0a0c;
    --mid: #6b6864;
    --rule: #c8c4bc;
    --paper: #ece8df;
    --paper-2: #f4f1ea;
    --red: #c0212a;
    --serif: 'Bodoni Moda', 'Bodoni 72', 'Didot', serif;
    --mono:  'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--paper); color: var(--ink); }
  body { overflow: hidden; }

  #world {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
  }
  #world canvas { display: block; }

  .masthead {
    position: fixed;
    top: 14px;
    left: 14px;
    right: 14px;
    z-index: 10;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 18px;
    pointer-events: none;
  }
  .masthead .title {
    font-family: var(--serif);
    font-weight: 900;
    font-size: 22px;
    letter-spacing: -0.01em;
    color: var(--ink);
    text-shadow: 0 1px 0 var(--paper-2);
  }
  .masthead .title .ed { font-style: italic; font-weight: 400; }
  .masthead .meta {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--mid);
  }
  .masthead .meta a {
    color: var(--mid);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
    pointer-events: auto;
  }
  .masthead .meta a:hover { color: var(--ink); border-color: var(--ink); }

  .back-to-arcade {
    position: fixed;
    bottom: 16px;
    left: 16px;
    z-index: 10;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--mid);
    text-decoration: none;
    border: 1px solid var(--rule);
    background: var(--paper-2);
    padding: 6px 10px;
  }
  .back-to-arcade:hover { color: var(--ink); border-color: var(--ink); }
</style>
</head>
<body>

<div id="world"></div>

<header class="masthead">
  <div class="title">Late <span class="ed">Edition</span></div>
  <div class="meta">
    Milestone 0.4 &middot; left-click select &middot; right-click dispatch &middot;
    <a href="design/phase-0-roadmap.html">Phase 0 + Roadmap &rarr;</a>
  </div>
</header>

<a href="../" class="back-to-arcade">&larr; Back to Arcade</a>

<script type="module" src="js/main.js"></script>

</body>
</html>
