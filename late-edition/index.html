<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Late Edition — 0.10.0 PR-C substrate</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;0,6..96,900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --ink: #0a0a0c;
    --mid: #6b6864;
    --rule: #c8c4bc;
    --paper: #ece8df;
    --paper-2: #f4f1ea;
    --paper-shadow: #b6afa1;
    --red: #c0212a;
    --serif: 'Bodoni Moda', 'Bodoni 72', 'Didot', serif;
    --mono:  'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
  /* Corkboard grid: masthead · top cards · viewport+deadline-strip · dossier row.
     The viewport (#world) sits in the 1fr row; the deadline strip overlays its top.
     The 3D renderer reads root.clientWidth/Height (js/render/renderer.js) so it
     reflows correctly inside the grid row when the window resizes. */
  body {
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto auto 1fr auto;
  }

  #world {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 0;
  }
  #world canvas { display: block; }

  .masthead {
    padding: 14px 18px 10px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 18px;
    border-bottom: 1px solid var(--rule);
    background: var(--paper);
  }
  .masthead .title {
    font-family: var(--serif);
    font-weight: 900;
    font-size: 22px;
    letter-spacing: -0.01em;
    color: var(--ink);
    text-shadow: 0 1px 0 var(--paper-2);
  }
  .masthead .title .ed { font-style: italic; font-weight: 400; }
  .masthead .meta {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--mid);
  }
  .masthead .meta a {
    color: var(--mid);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
  }
  .masthead .meta a:hover { color: var(--ink); border-color: var(--ink); }

  /* Top resource cards — pinned index cards along the top of the corkboard.
     Mock: design-doc §13. Serif numerals, mono kicker labels. */
  #hud-top-cards {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px 18px 12px;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
  }
  #hud-top-cards .card {
    background: var(--paper-2);
    border: 1px solid var(--rule);
    padding: 8px 14px;
    min-width: 96px;
    box-shadow: 2px 2px 0 var(--paper-shadow);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  #hud-top-cards .card .lbl {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--mid);
  }
  #hud-top-cards .card .val {
    font-family: var(--serif);
    font-weight: 900;
    font-size: 22px;
    line-height: 1;
    color: var(--ink);
    letter-spacing: -0.01em;
    font-feature-settings: "tnum";
  }
  #hud-top-cards .card.is-hot .val { color: var(--red); }

  /* Deadline ticker — typewriter ribbon strip across the top of the viewport.
     Lives inside the #world row, overlays the 3D scene; pointer-events:none so
     click-to-dispatch still hits the canvas underneath. */
  #hud-deadline-strip {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 5;
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 6px 18px 8px;
    background: var(--paper);
    border-bottom: 2px dashed var(--ink);
    box-shadow: 0 3px 0 -1px var(--paper-shadow);
    pointer-events: none;
  }
  #hud-deadline-strip .lbl {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--mid);
  }
  #hud-deadline-strip .val {
    font-family: var(--serif);
    font-weight: 900;
    font-size: 20px;
    line-height: 1;
    color: var(--ink);
    letter-spacing: -0.01em;
    font-feature-settings: "tnum";
  }
  #hud-deadline-strip .ed {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--mid);
    margin-left: auto;
  }
  #hud-deadline-strip.is-warning .val { color: var(--red); }
  #hud-deadline-strip.is-critical .val {
    color: var(--red);
    animation: deadline-pulse 0.5s ease-in-out infinite alternate;
  }
  @keyframes deadline-pulse {
    from { opacity: 0.5; }
    to   { opacity: 1; }
  }

  /* Dossier row — three panels along the bottom of the corkboard. */
  #hud-dossier {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    padding: 12px 18px 14px;
    background: var(--paper);
    border-top: 1px solid var(--rule);
  }
  #hud-dossier .panel {
    background: var(--paper-2);
    border: 1px solid var(--rule);
    padding: 10px 14px 12px;
    min-height: 78px;
    box-shadow: 2px 2px 0 var(--paper-shadow);
  }
  #hud-dossier .panel .lbl {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--mid);
    margin-bottom: 6px;
  }
  #hud-dossier .panel .body {
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.35;
    color: var(--ink);
  }
  #hud-dossier .panel .body .note {
    display: block;
    margin-top: 4px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--mid);
  }
  #hud-dossier .panel.empty .body {
    color: var(--mid);
    font-style: italic;
  }

  #debrief-panel {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10, 10, 12, 0.55);
    cursor: pointer;
  }
  #debrief-panel[hidden] { display: none; }
  #debrief-panel .debrief-card {
    background: var(--paper-2);
    border: 1px solid var(--ink);
    padding: 28px 36px;
    min-width: 360px;
    max-width: 520px;
    box-shadow: 0 12px 48px rgba(10, 10, 12, 0.6);
  }
  #debrief-panel .kicker {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.22em;
    color: var(--mid);
    margin-bottom: 8px;
  }
  #debrief-panel .banner {
    font-family: var(--serif);
    font-weight: 900;
    font-size: 32px;
    letter-spacing: -0.01em;
    color: var(--ink);
    border-bottom: 2px solid var(--ink);
    padding-bottom: 8px;
    margin-bottom: 14px;
  }
  #debrief-panel .story-list {
    list-style: none;
    padding: 0;
    margin: 0 0 18px 0;
  }
  #debrief-panel .story-row {
    padding: 8px 0;
    border-bottom: 1px solid var(--rule);
  }
  #debrief-panel .story-row:last-child { border-bottom: none; }
  #debrief-panel .headline {
    display: block;
    font-family: var(--serif);
    font-weight: 700;
    font-size: 16px;
    color: var(--ink);
  }
  #debrief-panel .meta-row {
    display: block;
    margin-top: 2px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--mid);
  }
  #debrief-panel .empty {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--mid);
    padding: 8px 0;
  }
  #debrief-panel .dismiss {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--red);
    text-align: right;
  }

  #gameover-overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10, 10, 12, 0.82);
  }
  #gameover-overlay[hidden] { display: none; }
  #gameover-overlay .gameover-card {
    background: var(--paper-2);
    border: 2px solid var(--red);
    padding: 32px 44px;
    min-width: 380px;
    max-width: 560px;
    box-shadow: 0 16px 48px rgba(10, 10, 12, 0.75);
    text-align: center;
  }
  #gameover-overlay .kicker {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.22em;
    color: var(--mid);
    margin-bottom: 10px;
  }
  #gameover-overlay .banner {
    font-family: var(--serif);
    font-weight: 900;
    font-size: 36px;
    letter-spacing: -0.01em;
    color: var(--red);
    border-bottom: 2px solid var(--red);
    padding-bottom: 12px;
    margin-bottom: 14px;
  }
  #gameover-overlay .reason {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink);
  }
  /* 0.9.3 (PR-A audit C-03): "Start a new run" button. Noir palette — paper
     ground, red border + label, ink on hover. The only exit from the terminal
     overlay — clears the save key and reloads (game-over-overlay.js). */
  #gameover-overlay .new-run {
    margin-top: 20px;
    background: var(--paper);
    border: 1px solid var(--red);
    color: var(--red);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 10px 22px;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  #gameover-overlay .new-run:hover {
    background: var(--red);
    color: var(--paper);
  }
  #gameover-overlay .new-run:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }
  /* 0.10.0 (G-13): run summary block sits between the banner and the
     new-run button. Diegetic styling — looks like the obituary block on
     the front page (rules, mono labels, serif numbers). */
  #gameover-overlay .run-summary {
    text-align: left;
    margin: 18px 0 6px;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 14px 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #gameover-overlay .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  #gameover-overlay .summary-row .lbl {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--mid);
  }
  #gameover-overlay .summary-row .val {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 18px;
    color: var(--ink);
    font-feature-settings: "tnum";
  }
  #gameover-overlay .summary-row.top-story {
    flex-wrap: wrap;
    border-top: 1px dashed var(--rule);
    border-bottom: 1px dashed var(--rule);
    padding: 8px 0;
  }
  #gameover-overlay .summary-row.top-story .headline {
    flex: 1 1 100%;
    font-family: var(--serif);
    font-weight: 900;
    font-size: 17px;
    color: var(--ink);
    letter-spacing: -0.005em;
  }
  #gameover-overlay .summary-row.top-story .cash {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--mid);
  }
  #gameover-overlay .scoreboard {
    list-style: none;
    margin: 4px 0 0;
    padding: 0;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--mid);
  }
  #gameover-overlay .scoreboard li {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
    border-bottom: 1px solid var(--paper);
    letter-spacing: 0.05em;
  }
  #gameover-overlay .scoreboard li.is-you {
    color: var(--red);
    font-weight: 700;
  }
  #gameover-overlay .scoreboard li .rank { min-width: 32px; }
  #gameover-overlay .scoreboard li .editions { flex: 1; text-align: center; }
  #gameover-overlay .scoreboard li .revenue { min-width: 80px; text-align: right; }
</style>
</head>
<body>

<header class="masthead">
  <div class="title">Late <span class="ed">Edition</span></div>
  <div class="meta">
    v0.10.0 &middot; PR-C substrate &middot; left-click select &middot; right-click dispatch &middot;
    <a href="design/phase-0-roadmap.html">Phase 0 + Roadmap &rarr;</a>
    &middot;
    <a href="../">&larr; Arcade</a>
  </div>
</header>

<section id="hud-top-cards">
  <div class="card" data-card="edition"><span class="lbl">Edition</span><span class="val">№ 001</span></div>
  <div class="card" data-card="deadline"><span class="lbl">Deadline</span><span class="val">12:00</span></div>
  <div class="card" data-card="leads"><span class="lbl">Leads</span><span class="val">1</span></div>
  <div class="card" data-card="stories"><span class="lbl">Stories</span><span class="val">0</span></div>
  <div class="card" data-card="ink"><span class="lbl">Ink</span><span class="val">20</span></div>
  <div class="card" data-card="cash"><span class="lbl">Cash</span><span class="val">$ 0</span></div>
  <div class="card" data-card="heat"><span class="lbl">Heat</span><span class="val">0</span></div>
</section>

<div id="world">
  <div id="hud-deadline-strip">
    <span class="lbl">Deadline</span>
    <span class="val">12:00</span>
    <span class="ed">Edition № 001</span>
  </div>
</div>

<section id="hud-dossier">
  <div class="panel empty" data-panel="selected"><div class="lbl">Selected</div><div class="body">No selection</div></div>
  <div class="panel" data-panel="queue"><div class="lbl">Story queue</div><div class="body">—</div></div>
  <div class="panel" data-panel="threats"><div class="lbl">Threats</div><div class="body">—</div></div>
</section>

<div id="debrief-panel" hidden></div>
<div id="gameover-overlay" hidden></div>

<script type="module" src="js/main.js"></script>

</body>
</html>
