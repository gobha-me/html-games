<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <title>HTML Games — Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a14;
            --surface: #12122a;
            --text: #e0e0f0;
            --muted: #7a7a9a;
            --forge: #f59e0b;
            --kimi: #f43f5e;
            --snake: #10b981;
            --invaders: #8b5cf6;
            --reclamation: #eab308;
            --cogfall: #d97706;
            --typing: #2ed573;
            --sokoban: #d97706;
            --solitaire: #e11d48;
            --tetris: #c084fc;
            --breakout: #38bdf8;
            --mines: #10b981;
            --pong: #00d4ff;
            --tiles: #a78bfa;
            --inkwell: #b8923d;
            --asteroids: #00ff88;
            --oregon-trail: #d4a574;
            --late-edition: #c0212a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ── starfield ── */
        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        /* ── header ── */
        .header {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 64px 24px 40px;
        }

        .header-icon {
            font-size: 56px;
            margin-bottom: 12px;
            display: block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .header h1 {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: clamp(36px, 8vw, 72px);
            letter-spacing: 0.04em;
            background: linear-gradient(135deg, #c084fc, #818cf8, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 0 24px rgba(129,140,248,0.3));
        }

        .header .sub {
            margin-top: 8px;
            font-size: 15px;
            color: var(--muted);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* ── grid ── */
        .grid {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 0 24px 80px;
        }

        /* ── card ── */
        .card {
            position: relative;
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 0;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: rgba(255,255,255,0.15);
            box-shadow: 0 20px 48px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
        }

        /* ── focus-visible (keyboard navigation) ── */
        .card:focus-visible {
            outline: 3px solid var(--text);
            outline-offset: 3px;
            transform: translateY(-6px);
            border-color: rgba(255,255,255,0.15);
        }

        .card.forge:focus-visible     { outline-color: var(--forge); }
        .card.kimi:focus-visible      { outline-color: var(--kimi); }
        .card.snake:focus-visible     { outline-color: var(--snake); }
        .card.invaders:focus-visible  { outline-color: var(--invaders); }
        .card.reclamation:focus-visible { outline-color: var(--reclamation); }
        .card.cogfall:focus-visible   { outline-color: var(--cogfall); }
        .card.tiles:focus-visible     { outline-color: var(--tiles); }
        .card.breakout:focus-visible  { outline-color: var(--breakout); }
        .card.mines:focus-visible     { outline-color: var(--mines); }
        .card.pong:focus-visible      { outline-color: var(--pong); }
        .card.typing:focus-visible    { outline-color: var(--typing); }
        .card.sokoban:focus-visible   { outline-color: var(--sokoban); }
        .card.inkwell:focus-visible   { outline-color: var(--inkwell); }
        .card-accent {
            height: 4px;
            width: 100%;
            transition: height 0.3s ease;
        }

        .card:hover .card-accent { height: 6px; }

        .card-body {
            padding: 28px 28px 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-emoji {
            font-size: 40px;
            margin-bottom: 16px;
            display: block;
            transition: transform 0.3s ease;
        }

        .card:hover .card-emoji { transform: scale(1.12); }

        .card h2 {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 20px;
            margin-bottom: 6px;
            letter-spacing: 0.02em;
        }

        .card .tagline {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 14px;
            line-height: 1.5;
        }

        .card .meta {
            margin-top: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .card .meta-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }

        /* per-game glow */
        .card.forge:hover     { box-shadow: 0 20px 48px rgba(0,0,0,0.5), 0 0 40px rgba(245,158,11,0.15); }
        .card.kimi:hover     { box-shadow: 0 20px 48px rgba(0,0,0,0.5), 0 0 40px rgba(244,63,94,0.15); }
        .card.snake:hover    { box-shadow: 0 20px 48px rgba(0,0,0,0.5), 0 0 40px rgba(16,185,129,0.15); }
        .card.invaders:hover { box-shadow: 0 20px 48px rgba(0,0,0,0.5), 0 0 40px rgba(139,92,246,0.18); }
        .card.reclamation:hover { box-shadow: 0 20px 48px rgba(0,0,0,0.5), 0 0 40px rgba(234,179,8,0.15); }
        .card.cogfall:hover  { box-shadow: 0 20px 48px rgba(0,0,0,0.5), 0 0 40px rgba(217,119,6,0.15); }
        .card.tiles:hover    { box-shadow: 0 20px 48px rgba(0,0,0,0.5), 0 0 40px rgba(167,139,250,0.18); }
        .card.breakout:hover { box-shadow: 0 20px 48px rgba(0,0,0,0.5), 0 0 40px rgba(56,189,248,0.18); }
        .card.mines:hover    { box-shadow: 0 20px 48px rgba(0,0,0,0.5), 0 0 40px rgba(16,185,129,0.15); }
        .card.pong:hover     { box-shadow: 0 20px 48px rgba(0,0,0,0.5), 0 0 40px rgba(0,212,255,0.18); }
        .card.typing:hover   { box-shadow: 0 20px 48px rgba(0,0,0,0.5), 0 0 40px rgba(46,213,115,0.18); }
        .card.sokoban:hover  { box-shadow: 0 20px 48px rgba(0,0,0,0.5), 0 0 40px rgba(217,119,6,0.15); }
        .card.solitaire:hover { box-shadow: 0 20px 48px rgba(0,0,0,0.5), 0 0 40px rgba(225,29,72,0.15); }
        .card.inkwell:hover   { box-shadow: 0 20px 48px rgba(0,0,0,0.5), 0 0 40px rgba(184,146,61,0.20); }

        /* ── footer ── */
        .footer {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 0 24px 40px;
            font-size: 13px;
            color: var(--muted);
            margin-top: auto;
        }

        .footer span { opacity: 0.6; }

        /* entrance animation */
        .card {
            opacity: 0;
            animation: cardIn 0.6s ease forwards;
        }


        @keyframes cardIn {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .grid { grid-template-columns: 1fr; padding: 0 16px 60px; }
            .header { padding: 40px 16px 28px; }
        }
    </style>
</head>
<body>

    <!-- starfield canvas -->
    <canvas class="stars" id="stars"></canvas>

    <!-- header -->
    <header class="header">
        <span class="header-icon">🕹️</span>
        <h1>HTML GAMES</h1>
        <p class="sub">Arcade Collection</p>
    </header>


    <!-- game grid — populated from games.json by the loader script below -->
    <main class="grid" id="game-grid"></main>



    <!-- footer -->
    <footer class="footer">
        <span>HTML Games Arcade &copy; 2025</span>
    </footer>

    <!-- starfield script -->
    <script>
        (function() {
            const c = document.getElementById('stars');
            const ctx = c.getContext('2d');
            let stars = [];
            const COUNT = 160;

            function resize() {
                c.width = window.innerWidth;
                c.height = window.innerHeight;
            }

            function seed() {
                stars = [];
                for (let i = 0; i < COUNT; i++) {
                    stars.push({
                        x: Math.random() * c.width,
                        y: Math.random() * c.height,
                        r: Math.random() * 1.6 + 0.3,
                        a: Math.random(),
                        speed: Math.random() * 0.008 + 0.002,
                        phase: Math.random() * Math.PI * 2
                    });
                }
            }

            function draw() {
                ctx.clearRect(0, 0, c.width, c.height);
                for (const s of stars) {
                    s.a += s.speed;
                    const alpha = 0.3 + 0.7 * ((Math.sin(s.a + s.phase) + 1) / 2);
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(200,210,255,${alpha.toFixed(2)})`;
                    ctx.fill();
                }
                requestAnimationFrame(draw);
            }

            resize();
            seed();
            draw();
            window.addEventListener('resize', () => { resize(); seed(); });
        })();
    </script>

    <!-- ── games.json loader ─────────────────────────────────────────────────
         fetch() requires HTTP. To open locally, serve via:
             python3 -m http.server 8080
         Opening index.html as a file:// URL will show a graceful error below.
         ──────────────────────────────────────────────────────────────────── -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const grid = document.getElementById('game-grid');
            try {
                const res = await fetch('games.json');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const { games } = await res.json();

                games.forEach((game, i) => {
                    const a = document.createElement('a');
                    a.href = game.href;
                    a.className = 'card ' + game.theme;
                    a.style.animationDelay = (0.05 + i * 0.07).toFixed(2) + 's';
                    a.innerHTML =
                        '<div class="card-accent" style="background:var(--' + game.theme + ')"></div>' +
                        '<div class="card-body">' +
                            '<span class="card-emoji">' + game.icon + '</span>' +
                            '<h2>' + game.title + '</h2>' +
                            '<p class="tagline">' + game.description + '</p>' +
                            '<div class="meta">' +
                                '<span class="meta-dot" style="background:var(--' + game.theme + ')"></span> ' +
                                game.tag +
                            '</div>' +
                        '</div>';
                    grid.appendChild(a);
                });
            } catch (err) {
                grid.innerHTML =
                    '<p style="color:var(--muted);grid-column:1/-1;text-align:center;padding:40px 0;line-height:2">' +
                    '\u26a0\ufe0f Could not load the game list.<br>' +
                    'Serve this page over HTTP \u2014 e.g. ' +
                    '<code style="font-family:monospace;color:var(--text)">python3 -m http.server 8080</code>' +
                    '</p>';
                console.error('[launcher] games.json load failed:', err);
            }
        });
    </script>

</body>
</html>
