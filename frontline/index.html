<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frontline — The Great Works War</title>
  <link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/back-to-arcade.css">
  <style>
    :root { --muted: #8a8065; --accent: #c9a227; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #26221a;
      color: #e8dfc6;
      font-family: 'Barlow Condensed', Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #c9a227; }
    a:hover { color: #e8dfc6; }
    .fl-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(10px, 2vw, 26px);
      padding-bottom: 56px;
      box-sizing: border-box;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 2px, transparent 2px 5px);
    }
    #app { width: 100%; max-width: 960px; }
    @keyframes flPop { 0% { transform: scale(.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes flCoin { 0% { transform: rotateY(0); } 70% { transform: rotateY(720deg); } 100% { transform: rotateY(900deg); } }
    @keyframes flFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    /* Weathervane initiative: needle whirls, then settles pointing up (FOE) or down (YOU). */
    @keyframes flVaneUp { 0% { transform: rotate(-90deg); } 100% { transform: rotate(1080deg); } }
    @keyframes flVaneDown { 0% { transform: rotate(-90deg); } 100% { transform: rotate(1260deg); } }
    .fl-scroll::-webkit-scrollbar { height: 8px; }
    .fl-scroll::-webkit-scrollbar-thumb { background: #5a5238; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="fl-shell">
    <div id="app"></div>
  </div>
  <a href="../" class="back-to-arcade">← Back to Arcade</a>
  <script type="module" src="js/main.js"></script>
</body>
</html>
